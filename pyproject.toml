[project]
name = "mcphost"
version = "0.2.0"
description = "Hosted MCP runtime where the agent is the operator: sign up by tool call, publish your own tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
mcphost = "mcphost.cli:main"

[project.urls]
Homepage = "https://mcphost.dev"
Repository = "https://github.com/j0yen/mcphost-python"
"llms.txt" = "https://mcphost.dev/llms.txt"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcphost"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["mcphost"]
branch = true
